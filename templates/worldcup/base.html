<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mundial 2026 - Pronósticos{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    {% block extra_head %}{% endblock %}
    <style>
        :root {
            --pico-font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --nav-bg: #1a1a2e;
            --nav-bg-solid: #1a1a2e;
            --nav-accent: #e94560;
            --nav-accent-text: #fff;
            --nav-border: #e94560;
        }
        .site-nav {
            background: var(--nav-bg);
            border-bottom: 3px solid var(--nav-border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            padding: 0.5rem 1rem;
        }
        .site-nav a { color: #fff; }
        .site-nav a:hover { color: var(--nav-accent); }
        .nav-brand {
            font-size: 1rem;
            text-decoration: none;
            padding: 0.25rem 0;
        }
        .nav-brand:hover { color: #fff; }
        .nav-toggle {
            display: none;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 6px;
            width: 38px;
            height: 36px;
            cursor: pointer;
            padding: 0;
            margin-left: auto;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }
        .nav-toggle span {
            display: block;
            width: 20px;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .site-nav.menu-open .nav-toggle span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
        .site-nav.menu-open .nav-toggle span:nth-child(2) { opacity: 0; }
        .site-nav.menu-open .nav-toggle span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
        .nav-season-switcher {
            display: flex;
            gap: 0.5rem;
            margin-left: 0.5rem;
        }
        .nav-season-switcher a {
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.18);
            transition: all 0.15s ease;
        }
        .nav-season-switcher a:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.45);
        }
        .nav-season-switcher a.active {
            background: var(--nav-accent);
            color: var(--nav-accent-text);
            border-color: var(--nav-accent);
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin: 0 0 0 auto;
            padding: 0;
            list-style: none;
        }
        .nav-links li { display: flex; align-items: center; }
        .nav-links a {
            display: inline-block;
            padding: 0.5rem 0.85rem;
            font-size: 0.95rem;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.08);
            color: var(--nav-accent);
        }
        .nav-link-btn {
            background: transparent;
            border: none;
            color: #fff;
            font: inherit;
            font-size: 0.95rem;
            padding: 0.5rem 0.85rem;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .nav-link-btn:hover {
            background: rgba(255,255,255,0.08);
            color: var(--nav-accent);
        }
        .nav-link-form {
            display: inline;
            margin: 0;
            padding: 0;
        }
        @media only screen and (max-width: 768px) {
            .site-nav {
                align-items: center;
                row-gap: 0.5rem;
            }
            .nav-toggle { display: flex; }
            .nav-brand { flex: 1; }
            .nav-season-switcher {
                order: 3;
                width: 100%;
                justify-content: center;
                margin: 0.25rem 0 0;
                flex-wrap: wrap;
            }
            .nav-links {
                order: 4;
                width: 100%;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                margin: 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.25s ease;
            }
            .nav-links li {
                width: 100%;
                border-top: 1px solid rgba(255,255,255,0.08);
            }
            .nav-links a,
            .nav-link-btn {
                display: block;
                width: 100%;
                text-align: left;
                padding: 0.85rem 0.5rem;
                border-radius: 0;
            }
            .nav-link-form { display: block; width: 100%; }
            .site-nav.menu-open .nav-links {
                max-height: 400px;
            }
        }
        .team-crest {
            width: 28px;
            height: 28px;
            object-fit: contain;
            vertical-align: middle;
            margin-right: 6px;
        }
        .team-crest-lg {
            width: 60px;
            height: 60px;
            object-fit: contain;
            vertical-align: middle;
        }
        .match-vs {
            font-weight: 700;
            color: #e94560;
            margin: 0 10px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        table th {
            background: #1a1a2e;
            color: #fff;
            font-weight: 600;
            padding: 12px 8px;
            text-align: left;
            border-bottom: 2px solid #e94560;
        }
        table td {
            padding: 10px 8px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }
        table tbody tr:hover {
            background: #f8f8f8;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-group {
            background: #e94560;
            color: #fff;
        }
        .badge-stage {
            background: #16213e;
            color: #fff;
        }
        .badge-live {
            background: #00d26a;
            color: #fff;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .score-display {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .goal-scorer {
            font-size: 0.85rem;
            color: var(--pico-muted-color);
        }
        .goal-scorer .minute {
            font-weight: 700;
            color: var(--pico-color);
        }
        .lineup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .lineup-section {
            background: var(--pico-card-background-color);
            border-radius: 8px;
            padding: 15px;
        }
        .lineup-section h4 {
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-list {
            list-style: none;
            padding: 0;
            margin: 0;
            columns: 2;
            column-gap: 15px;
        }
        .player-list li {
            padding: 4px 0;
            font-size: 0.9rem;
            break-inside: avoid;
        }
        .player-list .shirt-number {
            display: inline-block;
            width: 22px;
            height: 22px;
            background: var(--pico-color);
            color: var(--pico-background-color);
            border-radius: 50%;
            text-align: center;
            line-height: 22px;
            font-size: 0.75rem;
            margin-right: 6px;
        }
        .stats-section {
            margin-top: 20px;
        }
        .event-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
            font-size: 0.9rem;
        }
        .event-minute {
            font-weight: 700;
            color: var(--pico-color);
            min-width: 30px;
        }
        .event-icon {
            font-size: 1rem;
        }
        .card {
            background: var(--pico-card-background-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card h4 {
            margin: 0 0 12px 0;
            border-bottom: 2px solid var(--pico-primary-background);
            padding-bottom: 8px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card, .stat-item {
            background: var(--pico-card-background-color);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            display: block;
            font-size: 2rem;
            font-weight: bold;
            color: var(--pico-primary);
        }
        .stat-label {
            display: block;
            font-size: 0.8rem;
            color: var(--pico-muted-color);
            margin-top: 5px;
        }
        .badge.exact { background: var(--pico-primary); color: var(--pico-primary-inverse); }
        .badge.winner { background: var(--pico-secondary); color: var(--pico-secondary-inverse); }
        .badge.goals { background: var(--pico-warning); color: var(--pico-warning-inverse); }
        tr.highlight {
            background: var(--pico-table-row-hover-background-color);
            font-weight: bold;
        }
        .profile-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .profile-header h3 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .user-stats {
            background: var(--pico-card-background-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .user-stats h3 {
            margin: 0 0 15px 0;
        }

        /* === Tarjeta de perfil y estadísticas === */
        .profile-card {
            padding: 22px;
            border: 1px solid var(--pico-muted-border-color);
        }
        .profile-top {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e94560, #16213e);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
        .profile-identity { flex: 1; min-width: 160px; }
        .profile-identity h3 { margin: 0; font-size: 1.5rem; }
        .profile-meta {
            color: var(--pico-muted-color);
            font-size: 0.85rem;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge-own {
            background: #3366cc;
            color: #fff;
            text-transform: none;
            font-size: 0.7rem;
        }
        .rank-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            background: #16213e;
            color: #fff;
            white-space: nowrap;
        }
        .rank-badge.top3 { background: #e94560; }
        .rank-badge small { font-weight: 500; opacity: 0.8; font-size: 0.75rem; }
        .points-hero {
            text-align: center;
            margin: 20px 0 6px;
            padding: 14px 0;
            border-top: 1px solid var(--pico-muted-border-color);
            border-bottom: 1px solid var(--pico-muted-border-color);
        }
        .points-hero .pts {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--pico-primary);
            line-height: 1;
        }
        .points-hero .lbl {
            display: block;
            font-size: 0.78rem;
            color: var(--pico-muted-color);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-tile {
            background: var(--pico-card-background-color);
            border: 1px solid var(--pico-muted-border-color);
            border-radius: 8px;
            padding: 14px 10px;
            text-align: center;
        }
        .stat-tile .v {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--pico-color);
            display: block;
        }
        .stat-tile .l {
            display: block;
            font-size: 0.75rem;
            color: var(--pico-muted-color);
            margin-top: 4px;
            line-height: 1.2;
        }
        .stats-subsection { margin-top: 22px; }
        .stats-subsection h5 {
            margin: 0 0 12px 0;
            border-bottom: 1px solid var(--pico-muted-border-color);
            padding-bottom: 7px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--pico-muted-color);
        }
        .breakdown-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 18px;
            align-items: center;
        }
        .streak-row {
            margin-top: 14px;
            font-size: 0.85rem;
            color: var(--pico-muted-color);
            text-align: center;
        }
        .streak-row strong { color: var(--pico-color); }
        .dot-sep { margin: 0 6px; opacity: 0.5; }
        .chart-wrap {
            position: relative;
            height: 230px;
            min-width: 0;
        }
        .accuracy-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .accuracy-name {
            font-size: 0.85rem;
            min-width: 170px;
            flex-shrink: 0;
        }
        .accuracy-bar {
            flex: 1;
            height: 10px;
            background: var(--pico-muted-background-color);
            border-radius: 5px;
            overflow: hidden;
        }
        .accuracy-fill {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #e94560, #16213e);
            border-radius: 5px;
            transition: width 0.6s ease;
        }
        .accuracy-pct {
            font-weight: 700;
            min-width: 50px;
            text-align: right;
            font-size: 0.9rem;
        }
        .empty-note {
            text-align: center;
            color: var(--pico-muted-color);
            padding: 18px 0;
            margin: 0;
            font-size: 0.9rem;
        }
        @media only screen and (max-width: 600px) {
            .breakdown-grid { grid-template-columns: 1fr; }
            .profile-top { justify-content: center; text-align: center; }
            .profile-identity { flex-basis: 100%; }
            .accuracy-name { min-width: 120px; }
        }

        @media only screen and (prefers-color-scheme: dark) {
            table th {
                background: var(--pico-muted-background-color);
                color: var(--pico-color);
                border-bottom-color: var(--pico-primary);
            }
            table td {
                border-bottom-color: var(--pico-muted-border-color);
            }
            table tbody tr:hover {
                background: var(--pico-table-row-hover-background-color);
            }
            .match-vs {
                color: var(--pico-primary);
            }
        }
    </style>
</head>
<body>
    <nav class="container-fluid site-nav">
        <a href="{% url 'worldcup:dashboard' %}" class="nav-brand"><strong>Mundial 2026</strong></a>
        <button class="nav-toggle" type="button" aria-label="Menú" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-season-switcher">
            <a href="{% url 'worldcup:dashboard' %}" class="active">Mundial 2026</a>
            <a href="{% url 'champions:dashboard' %}">Champions League</a>
        </div>
        <ul class="nav-links">
            {% if user.is_authenticated %}
                <li><a href="{% url 'worldcup:dashboard' %}">Partidos</a></li>
                <li><a href="{% url 'worldcup:leaderboard' %}">Clasificación</a></li>
                <li><a href="{% url 'worldcup:profile' %}">Mi Perfil</a></li>
            {% else %}
                <li><a href="{% url 'login' %}">Iniciar Sesión</a></li>
                <li><a href="{% url 'signup' %}">Registrarse</a></li>
            {% endif %}
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    window.csrfToken = getCookie('csrftoken');

    (function () {
        const nav = document.querySelector('.site-nav');
        const toggle = document.querySelector('.nav-toggle');
        if (!nav || !toggle) return;
        toggle.addEventListener('click', function () {
            const open = nav.classList.toggle('menu-open');
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
    })();
</script>
</body>
</html>
