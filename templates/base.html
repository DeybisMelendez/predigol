<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mundial 2026 - Pronósticos{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    {% block extra_head %}{% endblock %}
    <style>
        :root {
            --pico-font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        nav.container-fluid {
            background: #1a1a2e;
            border-bottom: 3px solid #e94560;
        }
        nav.container-fluid a {
            color: #fff;
        }
        nav.container-fluid a:hover {
            color: #e94560;
        }
        .team-crest {
            width: 28px;
            height: 28px;
            object-fit: contain;
            vertical-align: middle;
            margin-right: 6px;
        }
        .team-crest-lg {
            width: 60px;
            height: 60px;
            object-fit: contain;
            vertical-align: middle;
        }
        .match-vs {
            font-weight: 700;
            color: #e94560;
            margin: 0 10px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        table th {
            background: #1a1a2e;
            color: #fff;
            font-weight: 600;
            padding: 12px 8px;
            text-align: left;
            border-bottom: 2px solid #e94560;
        }
        table td {
            padding: 10px 8px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }
        table tbody tr:hover {
            background: #f8f8f8;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-group {
            background: #e94560;
            color: #fff;
        }
        .badge-stage {
            background: #16213e;
            color: #fff;
        }
        .badge-live {
            background: #00d26a;
            color: #fff;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .score-display {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .goal-scorer {
            font-size: 0.85rem;
            color: var(--pico-muted-color);
        }
        .goal-scorer .minute {
            font-weight: 700;
            color: var(--pico-color);
        }
        .lineup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .lineup-section {
            background: var(--pico-card-background-color);
            border-radius: 8px;
            padding: 15px;
        }
        .lineup-section h4 {
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-list {
            list-style: none;
            padding: 0;
            margin: 0;
            columns: 2;
            column-gap: 15px;
        }
        .player-list li {
            padding: 4px 0;
            font-size: 0.9rem;
            break-inside: avoid;
        }
        .player-list .shirt-number {
            display: inline-block;
            width: 22px;
            height: 22px;
            background: var(--pico-color);
            color: var(--pico-background-color);
            border-radius: 50%;
            text-align: center;
            line-height: 22px;
            font-size: 0.75rem;
            margin-right: 6px;
        }
        .stats-section {
            margin-top: 20px;
        }
        .event-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
            font-size: 0.9rem;
        }
        .event-minute {
            font-weight: 700;
            color: var(--pico-color);
            min-width: 30px;
        }
        .event-icon {
            font-size: 1rem;
        }
        .card {
            background: var(--pico-card-background-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card h4 {
            margin: 0 0 12px 0;
            border-bottom: 2px solid var(--pico-primary-background);
            padding-bottom: 8px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card, .stat-item {
            background: var(--pico-card-background-color);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            display: block;
            font-size: 2rem;
            font-weight: bold;
            color: var(--pico-primary);
        }
        .stat-label {
            display: block;
            font-size: 0.8rem;
            color: var(--pico-muted-color);
            margin-top: 5px;
        }
        .badge.exact { background: var(--pico-primary); color: var(--pico-primary-inverse); }
        .badge.winner { background: var(--pico-secondary); color: var(--pico-secondary-inverse); }
        .badge.goals { background: var(--pico-warning); color: var(--pico-warning-inverse); }
        tr.highlight {
            background: var(--pico-table-row-hover-background-color);
            font-weight: bold;
        }
        .profile-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .profile-header h3 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .user-stats {
            background: var(--pico-card-background-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .user-stats h3 {
            margin: 0 0 15px 0;
        }

        @media only screen and (prefers-color-scheme: dark) {
            table th {
                background: var(--pico-muted-background-color);
                color: var(--pico-color);
                border-bottom-color: var(--pico-primary);
            }
            table td {
                border-bottom-color: var(--pico-muted-border-color);
            }
            table tbody tr:hover {
                background: var(--pico-table-row-hover-background-color);
            }
            .match-vs {
                color: var(--pico-primary);
            }
        }
    </style>
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong><a href="{% url 'dashboard' %}">Mundial 2026</a></strong></li>
        </ul>
        <ul>
            {% if user.is_authenticated %}
                <li><a href="{% url 'dashboard' %}">Partidos</a></li>
                <li><a href="{% url 'leaderboard' %}">Clasificación</a></li>
                <li><a href="{% url 'profile' %}">Mi Perfil</a></li>
            {% else %}
                <li><a href="{% url 'login' %}">Iniciar Sesión</a></li>
                <li><a href="{% url 'signup' %}">Registrarse</a></li>
            {% endif %}
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    window.csrfToken = getCookie('csrftoken');
</script>
</body>
</html>
